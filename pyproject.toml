[project]
name = "emberisegellenes-kartyak"
version = "1.0.0"
description = "Mobile-first multiplayer party card game in Hungarian: FastAPI + WebSockets backend, vanilla JS frontend."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Gergo Gyori" }]
# Exact, verified versions live in requirements.txt / requirements-dev.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    # The translated card texts (database/card_master.db) are not in the repository.
    # CI runs on scripts/make_sample_db.py's made-up cards and deselects these.
    "local_data: needs the real database/card_master.db; deselected in CI (-m \"not local_data\")",
]

[tool.coverage.run]
source = ["server", "scripts"]
branch = true

[tool.coverage.report]
# A ratchet, not a target: set just under the measured total (76% on 2026-11-06) so coverage can't
# quietly drop. Raise it when tests are added. CI runs: pytest -m "not local_data" --cov
fail_under = 75
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 120          # only used to wrap long import lines; E501 (line too long) is not enforced

[tool.ruff.lint]
# Listed explicitly: ruff's default rule set changes between releases, so relying on it would let a
# ruff upgrade turn CI red without any code change. The version is pinned in requirements-dev.txt.
select = [
    "E4", "E7", "E9",  # pycodestyle: statements, imports, syntax errors
    "F",               # pyflakes: unused/undefined names, redefinitions
    "B",               # flake8-bugbear: likely bugs (loop-variable closures, broad assertRaises, ...)
    "I",               # isort: import order
    "UP",              # pyupgrade: modern syntax for the target Python
]
