# Settings for `python -m ml.pipeline` (the nightly run, deploy/systemd/eek-ml-train.timer).

[export]
# Empty: gameplay.db in the game's data directory (EEK_DATA_DIR, or the repository root).
db = ""
# Empty: snapshots/ in the ML data directory (EEK_ML_DATA_DIR, or ml-data/ in the repository).
snapshots = ""

[validate]
# The earliest plausible game date (the check "days"): when gameplay logging went live.
first_day = "2026-11-06"

[train]
embeddings = ["minilm", "e5", "granite"]
models = ["linear", "mlp"]
experiment = "pick-model"
register = true
# Data variants (ml/evaluate.py): A human picks (registered), B + games with a computer player, C + vote winners.
variants = ["A", "B", "C"]

[trigger]
# Train only when at least this many new training picks (one-blank human submissions) arrived since the
# last cycle in MLflow. Most games are at weekends, so most weekday nights there's nothing to do.
min_new_picks = 20

[promote]
# After training, promote the new challenger to champion (production's computer player) without a person,
# but only if it is significantly better on the newest test picks (ml/promote.py --auto).
auto = true

[cloud]
# `python -m ml.cloud`: the same training as a GCP Cloud Run Job (docs/ml/gcp-setup.md).
project = "emberisegelleneskartya"
region = "europe-west4"
bucket = "emberisegelleneskartya-ml"
job = "eek-train"
# The eek-uploader service account's key: may create objects in the bucket and run this one job.
key_file = "~/.config/eek/gcp-uploader.json"
# For the run links: the job logs to this MLflow over HTTPS.
mlflow_url = "https://mlflow.emberisegelleneskartyak.hu"
