# Weekly update PRs; each one runs the full CI (tests, audit, e2e on the built image) before it can merge.
version: 2
updates:
  - package-ecosystem: pip            # updates requirements*.in and regenerates the pip-compile lock files
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker         # the digest-pinned base image in the Dockerfile
    directory: /
    schedule:
      interval: weekly
