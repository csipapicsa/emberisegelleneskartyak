name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, even without code changes: new vulnerabilities are published for dependencies we already pin,
  # and the runner images change under us.
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:      # "Run workflow" button in the Actions tab

# Least privilege: the jobs only need to read the code.
permissions:
  contents: read

# A new push to a PR cancels that PR's older, now-outdated run. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Does this PR touch anything besides documentation? lint, audit and test only run if it does.
    # Jobs skipped by an `if:` count as passed for required checks; skipping the whole workflow (paths-ignore)
    # would leave the required checks waiting forever. This job is a required check itself: if it fails,
    # the jobs after it are skipped, and without that requirement a skip would let the PR through.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2  # the PR's merge preview and its parents
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # Pushes to main, the weekly run and manual runs always run everything.
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # For a PR, HEAD is GitHub's merge preview; its first parent is the target branch.
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "Changed files:"
          echo "$changed"
          # Fail-safe: only docs/, *.md and LICENSE count as documentation; anything else (or an empty diff) is code.
          if printf '%s\n' "$changed" | grep -qvE '^docs/|\.md$|^LICENSE$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Documentation-only change: lint, audit and test are skipped."
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Install only ruff, at the version pinned in requirements-dev.txt (one source of truth).
      - run: python -m pip install "$(grep -oE '^ruff==[^ ]+' requirements-dev.txt)"
      # "github" format turns findings into annotations on the PR's changed lines.
      - run: python -m ruff check --output-format=github server tests scripts ml notebooks

  secret-scan:
    # Always runs: a secret pasted into a Markdown file is still a leak.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.30.1"  # same version as used locally
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the whole history, not just the latest commit: a secret stays in history once committed
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # GitHub's release downloads sometimes answer 504 for a few minutes: retry for ~2 minutes before failing.
          retry=(--retry 8 --retry-delay 15)
          curl -sSfLO "${retry[@]}" "$base/$archive"
          curl -sSfLO "${retry[@]}" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$archive" gitleaks
      # --redact: CI logs of a public repo are public, so a found secret must not be printed in them.
      - run: ./gitleaks git --redact --verbose .

  audit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: >-
          python -m pip install "$(grep -oE '^pip-audit==[^ ]+' requirements-dev.txt)"
          "$(grep -oE '^pip-tools==[^ ]+' requirements-dev.txt)"
      - name: Lock files match requirements*.in
        run: |
          # pip-compile keeps existing pins, so lock files that are in sync come out unchanged. Only pins and
          # hashes count: the "# via" comments differ between pip versions.
          for f in requirements requirements-dev requirements-notebooks; do
            pip-compile -q --generate-hashes --allow-unsafe --strip-extras --no-emit-index-url "$f.in" -o "$f.txt"
          done
          git diff --exit-code -I '^ *#' -- requirements.txt requirements-dev.txt requirements-notebooks.txt \
            || { echo "::error::Lock files are out of date. Regenerate them with pip-compile (see requirements.in)."; exit 1; }
      # Recompiling requirements-ml.txt would download every PyTorch wheel on the CPU index (~11 GB) just to
      # hash them, so its pins are checked against requirements-ml.in and requirements-dev.txt instead.
      - name: ML lock file matches requirements-ml.in
        run: python scripts/check_ml_lock.py
      # The lock files pin every installed package, so this audits exactly what the image and CI install.
      # --disable-pip: look the pinned versions up instead of installing them (all four files are hashed).
      - run: >-
          python -m pip_audit --disable-pip -r requirements.txt -r requirements-dev.txt -r requirements-ml.txt
          -r requirements-notebooks.txt
          --progress-spinner off
      # PyPI doesn't know torch's "+cpu" builds, so the step above skips torch: audit it by its plain version.
      - name: Audit torch
        run: |
          grep -oE '^torch==[0-9.]+' requirements-ml.txt > torch-version.txt
          python -m pip_audit --no-deps --disable-pip -r torch-version.txt --progress-spinner off
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Production is a Linux server, so the tests run on Linux.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # 3.9 is the server's system Python, which runs scripts/backup_databases.py from systemd;
          # tests/test_backup_databases.py runs the script with it. The last version listed is the default.
          python-version: |
            3.9
            3.11
          cache: pip
          cache-dependency-path: requirements*.txt
      # The client-side JavaScript is tested under Node (tests/js/, and some pytest files run node directly).
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      # The real card texts are not in the repository; the game runs on made-up sample cards.
      - run: python scripts/make_sample_db.py
      # Run on their own as well: pytest's wrapper skips them when node is missing, this step would fail instead.
      - name: JavaScript tests
        run: node --test tests/js/*.test.js
      # local_data tests need the real card database; see pyproject.toml.
      # --cov enforces fail_under from pyproject.toml: the job fails if coverage drops below it.
      # The browser tests run in their own job (e2e), the ML pipeline's in theirs (ml).
      - run: python -m pytest -m "not local_data" --cov --ignore=tests/e2e --ignore=tests/ml
      # Coverage table on the run's summary page, also when the gate fails.
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

  ml:
    # The ML pipeline (ml/, docs/ml/implementation-plan.md) with its own dependencies (requirements-ml.txt),
    # on made-up gameplay data: the real log never leaves the server.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      # requirements-ml.txt pins shared packages to the dev lock file's versions, so both install together.
      - run: >-
          python -m pip install --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu
          -r requirements-dev.txt -r requirements-ml.txt
      - run: python -m pytest tests/ml --cov=ml
      - name: The pipeline from the command line, on sample data
        run: |
          python scripts/make_sample_gameplay_db.py --out sample-data/gameplay.db
          python -m ml.export --db sample-data/gameplay.db --out ml-data/snapshots
          python -m ml.validate --first-day 2025-01-01 ml-data/snapshots/*/

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Builds the production image and tests *it*: the container runs on the sample cards and three headless
    # Chromium "phones" play one round against it. On main the tested image is handed to the publish job,
    # so what gets published is exactly what was tested.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: emberisegellenes:ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Build the image
        run: docker build --build-arg GIT_SHA="${GITHUB_SHA::7}" -t "$IMAGE" .
      - name: Start it on the sample cards
        run: |
          mkdir -p ci-data/database
          python scripts/make_sample_db.py --out ci-data/database/card_master.db
          chmod -R a+rwX ci-data  # the app runs as UID 10001 inside the container
          docker run -d --name app -p 127.0.0.1:8010:8010 -v "$PWD/ci-data:/data" "$IMAGE"
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8010/healthz && break; sleep 1; done
          echo
          version=$(curl -sf http://127.0.0.1:8010/healthz | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          test "$version" = "${GITHUB_SHA::7}" || { echo "::error::healthz reports '$version', expected ${GITHUB_SHA::7}"; exit 1; }
      - run: python -m pip install -r requirements-dev.txt
      # The browser build that belongs to the pinned playwright package, plus the system libraries it needs.
      - run: python -m playwright install --with-deps --only-shell chromium
      # Without the browser the tests would skip; here a missing browser fails the job instead.
      - name: End-to-end test against the container
        run: python -m pytest tests/e2e
        env:
          EEK_E2E_REQUIRED: "1"
          EEK_E2E_BASE_URL: http://127.0.0.1:8010
          EEK_E2E_DATA_DIR: ci-data  # the container's /data, so the test can check the gameplay log
      - name: Container log
        if: ${{ !cancelled() }}
        run: docker logs app
      - name: Save the tested image for publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "$IMAGE" | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: image
          path: image.tar.gz
          retention-days: 1

  publish:
    # Pushes the image tested in e2e to GitHub's container registry, only from main and only when every
    # check passed. The only job with write access (packages), and it runs no third-party code.
    needs: [lint, test, ml, audit, secret-scan, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      REPO_IMAGE: ghcr.io/csipapicsa/emberisegelleneskartyak
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
      - run: gunzip -c image.tar.gz | docker load
      - name: Push sha-<commit> and main tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in "sha-${GITHUB_SHA::7}" main; do
            docker tag emberisegellenes:ci "$REPO_IMAGE:$tag"
            docker push "$REPO_IMAGE:$tag"
          done
          echo "Published $REPO_IMAGE:sha-${GITHUB_SHA::7} (also :main)" >> "$GITHUB_STEP_SUMMARY"
