# MLflow's login (the basic-auth app). No secrets in here: the first admin password comes from
# MLFLOW_AUTH_ADMIN_PASSWORD (/etc/eek/mlflow.env), and only on the very first start, when the user
# database is empty. After that it is ignored; change passwords through MLflow's API (see
# deploy/containers/README.md).
[mlflow]
# Every logged-in user can read every experiment; whoever creates an experiment can manage it.
# Without a login nothing is readable.
default_permission = READ
database_uri = sqlite:////data/basic_auth.db
admin_username = admin
authorization_function = mlflow.server.auth:authenticate_request_basic_auth
grant_default_workspace_access = false
