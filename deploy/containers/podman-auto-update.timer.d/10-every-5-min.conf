# podman auto-update checks the registry once a day by default. Staging should follow main within minutes.
# Installed as /etc/systemd/user/podman-auto-update.timer.d/10-every-5-min.conf; it only has an effect for
# users who enable the timer (eek).
[Timer]
OnCalendar=
OnCalendar=*:0/5
RandomizedDelaySec=0
