[Service]
# Releases the computer player on production: the game offers "+ Gépi játékos" only when it knows the model
# service (server/bot.py). The service runs as eek-model.container and publishes 127.0.0.1:8020 for this
# host-run game; production plays the "champion" model, which moves only with `python -m ml.promote`.
# Without the service the computer player still plays, at random, and /healthz counts it ("random").
Environment=EEK_MODEL_URL=http://127.0.0.1:8020
Environment=EEK_MODEL_NAME=champion
