# staging.emberisegelleneskartyak.hu -> the staging container (deploy/containers/eek-staging.container).
# Password-protected, so players and search engines don't end up on it. After installing, certbot adds
# HTTPS to this file:  sudo certbot --nginx -d staging.emberisegelleneskartyak.hu
server {
    listen 80;
    server_name staging.emberisegelleneskartyak.hu;
    access_log /var/log/nginx/eek-staging.access.log;
    error_log /var/log/nginx/eek-staging.error.log warn;

    auth_basic "Staging";
    auth_basic_user_file /etc/nginx/eek-staging.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # The app reads the client IP from X-Real-IP; don't pass on a client-supplied forwarding chain.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:8011;
    }

    # Public, so CI can check which commit is live. It returns only {"status", "version"}.
    location = /healthz {
        auth_basic off;
        proxy_pass http://127.0.0.1:8011;
    }

    # /admin/ has its own login (EEK_ADMIN_STATS_KEY). Two Basic Auth layers on one URL can't work.
    location /admin/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8011;
    }
}
