# mlflow.emberisegelleneskartyak.hu -> the MLflow container (deploy/containers/eek-mlflow.container).
# No nginx password: MLflow has its own login (users admin, trainer, reader), and clients send it as
# HTTP Basic Auth (MLFLOW_TRACKING_USERNAME / MLFLOW_TRACKING_PASSWORD). Only safe over HTTPS, which
# certbot adds to this file:  sudo certbot --nginx -d mlflow.emberisegelleneskartyak.hu
server {
    listen 80;
    server_name mlflow.emberisegelleneskartyak.hu;
    access_log /var/log/nginx/eek-mlflow.access.log;
    error_log /var/log/nginx/eek-mlflow.error.log warn;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # Models and datasets are uploaded through MLflow (--serve-artifacts). Stream them to MLflow instead
    # of buffering them on disk first, and allow a few minutes for big ones.
    client_max_body_size 1g;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:5000;
    }
}
