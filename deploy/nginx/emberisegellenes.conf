server {
    listen 80;
    server_name emberisegelleneskartyak.hu www.emberisegelleneskartyak.hu;
    client_max_body_size 16k;
    access_log /var/log/nginx/emberisegellenes.access.log;
    error_log /var/log/nginx/emberisegellenes.error.log warn;

    # Prometheus reads /metrics on 127.0.0.1; the app also refuses requests carrying nginx's proxy headers.
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Do not preserve an attacker-supplied forwarding chain.  The backend
        # trusts only this nginx instance, which sets the actual client IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
