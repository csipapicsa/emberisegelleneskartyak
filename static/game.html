<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Játék – Emberiség Ellenes Kártyák</title>
  <meta name="robots" content="noindex, follow">

  <!-- Open Graph (for sharing game links) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Játssz az Emberiség Ellenes Kártyák online játékkal!">
  <meta property="og:description" content="Online kártyajáték barátokkal — a Cards Against Humanity ingyenes magyar verziója. Regisztráció nélkül.">
  <meta property="og:image" content="https://emberisegelleneskartyak.hu/static/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:site_name" content="Emberiség Ellenes Kártyák">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Játssz az Emberiség Ellenes Kártyák online játékkal!">
  <meta name="twitter:description" content="Online kártyajáték barátokkal — a Cards Against Humanity ingyenes magyar verziója. Regisztráció nélkül.">
  <meta name="twitter:image" content="https://emberisegelleneskartyak.hu/static/og-image.png">

  <!-- Icons & Manifest -->
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="manifest" href="/static/site.webmanifest">
  <meta name="theme-color" content="#000000">

  <link rel="stylesheet" href="/static/css/base.css?v=20260627-community">
  <link rel="stylesheet" href="/static/css/cards.css?v=20260910-feedback">
  <link rel="stylesheet" href="/static/css/game.css?v=20260910-feedback">
  <link rel="stylesheet" href="/static/css/chat.css?v=20260707-chat2">
  <script src="/static/js/umami-normalize.js?v=20261016-umami-norm"></script>
  <script defer src="https://stats.emberisegelleneskartyak.hu/script.js" data-website-id="3a36dfac-359e-4e1c-afda-27530984c903" data-before-send="umamiBeforeSend"></script>
</head>
<body>
  <div id="roomNotFound" class="page hidden" style="justify-content:center;align-items:center;text-align:center;gap:24px">
    <div class="logo">Emberiség Ellenes Kártyák</div>
    <h1>Ez a szoba nem létezik.</h1>
    <p style="color:var(--text-muted)">Kérlek fáradj a főoldalra.</p>
    <a href="/" class="btn btn-primary" style="max-width:260px">Főoldal</a>
  </div>

  <div id="gameAlreadyStarted" class="page hidden" style="justify-content:center;align-items:center;text-align:center;gap:24px">
    <div class="logo">Emberiség Ellenes Kártyák</div>
    <h1>Itt már elkezdődött a játék.</h1>
    <p style="color:var(--text-muted)">Kérlek fáradj a főoldalra.</p>
    <a href="/" class="btn btn-primary" style="max-width:260px">Főoldal</a>
  </div>

  <!-- Main game screen -->
  <div class="game-page">

    <!-- Top bar -->
    <div class="game-topbar">
      <span class="room-code" id="roomCodeEl"></span>
      <span class="round-info" id="roundEl"></span>
      <span class="timer" id="timerEl"></span>
      <button class="mic-btn hidden" id="micBtn" title="Mikrofon be/ki">🎤</button>
      <button class="mic-btn hidden" id="speakerBtn" title="Hangszóró be/ki">🔊</button>
    </div>

    <!-- Black card -->
    <div class="black-card-area">
      <div class="black-card" id="blackCard"></div>
    </div>

    <!-- Status -->
    <div class="status-bar" id="statusBar"></div>

    <!-- Middle: revealed cards / waiting -->
    <div class="game-middle" id="gameMiddle"></div>

    <!-- Czar hint (hidden until reveal) -->
    <div id="czarHint" class="hidden"></div>

    <!-- Hand area -->
    <div class="hand-area" id="handArea">
      <div class="hand-header" id="handToggle">
        <span>A kezed</span>
        <span style="display:flex;align-items:center;gap:8px">
          <span id="handCount"></span>
          <span class="hand-chevron" id="handChevron">▲</span>
        </span>
      </div>
      <div class="hand-body" id="handBody">
        <div class="hand-container" id="handContainer">
          <div class="hand-track"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Players panel -->
  <div class="players-panel" id="playersPanel"></div>
  <div class="players-panel-overlay" id="panelOverlay" onclick="togglePlayers()"></div>

  <!-- FAB buttons -->
  <button class="chat-btn" id="chatBtn" title="Chat">💬</button>
  <button class="scores-fab" id="scoresFab" title="Pontok">🏆</button>

  <!-- Card confirm modal -->
  <div class="overlay hidden" id="confirmModal">
    <div class="modal">
      <h2>Ezt küldöd be?</h2>
      <div class="card-white" id="confirmPreview" style="font-size:.9rem"></div>
      <div id="confirmMultiPreview" style="display:none;flex-direction:column;gap:8px"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="confirmNo">Mégsem</button>
        <button class="btn btn-primary"   id="confirmYes">Igen, beküldöm!</button>
      </div>
    </div>
  </div>

  <!-- Chat modal -->
  <div class="overlay hidden" id="chatModal">
    <div class="modal chat-modal">
      <div class="chat-modal-header">
        <h2>Chat</h2>
        <button class="chat-close-btn" id="chatCloseBtn">✕</button>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-row">
        <input class="input" id="chatInput" type="text" maxlength="500" placeholder="Írj üzenetet...">
        <button class="btn btn-primary" id="chatSendBtn">Küldés</button>
      </div>
    </div>
  </div>

  <!-- Card feedback popup — lowest priority UI: force-closed on any round
       transition or timeout, no matter what state it was left in. -->
  <div class="overlay hidden" id="feedbackModal">
    <div class="modal feedback-modal">
      <div class="chat-modal-header">
        <h2>Visszajelzés a kártyára</h2>
        <button class="chat-close-btn" id="feedbackCloseBtn">✕</button>
      </div>
      <div class="feedback-card-preview" id="feedbackCardPreview"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary feedback-reaction-btn like" id="feedbackLikeBtn" type="button">👍 Tetszik</button>
        <button class="btn btn-secondary feedback-reaction-btn dislike" id="feedbackDislikeBtn" type="button">👎 Nem tetszik</button>
      </div>
      <textarea class="input feedback-comment" id="feedbackComment" maxlength="500" rows="3" placeholder="Megjegyzés (opcionális)"></textarea>
      <button class="btn btn-primary" id="feedbackSubmitBtn" type="button" disabled>Beküldés</button>
    </div>
  </div>

  <!-- Winner announcement (3 seconds) -->
  <div class="winner-overlay hidden" id="winnerOverlay">
    <div class="winner-box">
      <div class="winner-label" id="winnerLabel"></div>
      <div class="winner-cards" id="winnerCards"></div>
    </div>
  </div>

  <!-- End screen -->
  <div class="end-screen hidden" id="endScreen">
    <h1>Játék vége! 🎉</h1>
    <div class="end-podium" id="podium"></div>
    <a href="/" class="btn btn-primary" style="width:100%;max-width:320px">Vissza a főoldalra</a>
  </div>

  <div id="toast"></div>

  <script src="/static/js/session.js"></script>
  <script src="/static/js/ws.js"></script>
  <script src="/static/js/voice.js?v=20260805-voicefix"></script>
  <script src="/static/js/chat.js?v=20260707-backtrap"></script>
  <script src="/static/js/hand.js?v=20260910-feedback"></script>
  <script src="/static/js/game.js?v=20260910-feedback"></script>
  <script>
    const code = location.pathname.split('/').pop();
    (async () => {
      const sid = await getSession();
      initGame(code, sid);
    })();

    // Keep screen on while playing
    let _wakeLock = null;
    async function _acquireWakeLock() {
      if (!('wakeLock' in navigator)) return;
      try { _wakeLock = await navigator.wakeLock.request('screen'); } catch {}
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') _acquireWakeLock();
    });
    _acquireWakeLock();
  </script>
</body>
</html>
